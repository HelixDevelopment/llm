# Phase-4 GPU video-gen — WAN 2.2 / LTX-Video, served on its OWN port (:18443,
# config-injected). Booted THROUGH the containers submodule compose.Orchestrator
# (§11.4.76), rootless podman (§11.4.161) with GPU access via the NVIDIA CDI
# spec. Distinct from the coder (:18434) and the image-gen sibling (:18442) —
# §11.4.119 single-resource-owner.
#
# NO hardcoded model / precision / clip-shape / host-port literal
# (§CONST-045 / §CONST-046). Two different kinds of ${VAR} appear below:
#
#   DECIDED — VIDEOGEN_MODEL, _BACKEND, _PRECISION, _SIZE, _NUM_FRAMES, _FPS are
#     written by `videogen-boot boot` from the MEASURED selection (FR-056): it
#     measures this host, joins that against the recorded catalogue under the
#     declared usage, and writes the chosen model's values here for
#     interpolation. A value already in the environment is reported as
#     IGNORED-CONFIG and overwritten — configuration may say WHERE things live,
#     never WHICH model runs. There is no default: when nothing can be chosen,
#     `videogen-boot` exits non-zero with the reason and this file is never
#     `up`'d.
#   OPERATOR — VIDEOGEN_CPU_OFFLOAD, _MAX_STEPS, _HOST_PORT, _MEM_LIMIT,
#     _SHM_SIZE, _WEIGHTS_DIR, HF_TOKEN say HOW and WHERE the service runs.
#     None names a model. _WEIGHTS_DIR overrides where the decision measures
#     the weights-storage axis (default: the helixllm-videogen-cache volume's
#     mountpoint — see cmd/videogen-boot/modelchoice.go).
#
# The GPU reservation is admitted by the vrambroker (ClassVideo) for the CHOSEN
# model's recorded requirement BEFORE this file is `up`'d (cmd/videogen-boot).
services:
  videogen:
    build:
      context: ../../services/videogen
      dockerfile: Containerfile
    image: helixllm-videogen:wan-fp8
    environment:
      VIDEOGEN_BACKEND: "${VIDEOGEN_BACKEND}"          # DECIDED — wan | ltx
      VIDEOGEN_MODEL: "${VIDEOGEN_MODEL}"              # DECIDED — the chosen entry's recorded source
      VIDEOGEN_PRECISION: "${VIDEOGEN_PRECISION}"      # DECIDED — the chosen build's quantisation
      VIDEOGEN_NUM_FRAMES: "${VIDEOGEN_NUM_FRAMES}"    # DECIDED — the shape admission was granted for
      VIDEOGEN_FPS: "${VIDEOGEN_FPS}"                  # DECIDED
      VIDEOGEN_SIZE: "${VIDEOGEN_SIZE}"                # DECIDED
      VIDEOGEN_CPU_OFFLOAD: "${VIDEOGEN_CPU_OFFLOAD}"  # OPERATOR
      VIDEOGEN_MAX_STEPS: "${VIDEOGEN_MAX_STEPS}"      # OPERATOR
      HF_HOME: /models/hf
      HF_TOKEN: "${HF_TOKEN}"                          # §11.4.10 — from .env, never committed/logged
    ports:
      - "${VIDEOGEN_HOST_PORT}:8080"
    volumes:
      - helixllm-videogen-cache:/models/hf
    # Rootless-podman GPU access via CDI (§11.4.161). The NVIDIA container
    # toolkit must have generated the CDI spec (nvidia.com/gpu=all).
    devices:
      - "nvidia.com/gpu=all"
    # §12.3 container hygiene + §12.6 host-safety — bounded so a first-run OOM
    # cannot starve the developer host. Config-injected, captured as evidence.
    mem_limit: "${VIDEOGEN_MEM_LIMIT}"
    shm_size: "${VIDEOGEN_SHM_SIZE}"
    restart: "no"
volumes:
  helixllm-videogen-cache:
    external: true
    name: helixllm-videogen-cache
